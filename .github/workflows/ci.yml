
name: Professor Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f supabase.js
          test -f admin.html
          test -f dashboard.html

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check supabase.js
