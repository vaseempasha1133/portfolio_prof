<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In | Dr. Shaik Imamvali</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--navy);
      padding: 24px;
      position: relative;
    }
    .professor-profile {
      position: absolute;
      top: 30px;
      left: 35px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: white;
      text-decoration: none;
    }
    .professor-photo {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c4a15a;
      background: #fff;
    }
    .professor-details h2 {
      font-family: Georgia, serif;
      font-size: 25px;
      margin: 0 0 7px;
      color: #fff;
    }
    .professor-details p {
      margin: 0;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #c9d2e0;
      text-transform: uppercase;
    }
    .login-card {
      width: min(100%, 440px);
      background: var(--paper);
      padding: 38px;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
      margin-top: 95px;
    }
    .login-card h1 {
      font-size: 36px;
      color: var(--navy);
      margin: 22px 0 12px;
    }
    .login-card > p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }
    .login-card .button {
      margin-top: 16px;
      width: 100%;
      justify-content: center;
    }
    .notice {
      background: #f1ecdf;
      padding: 12px;
      margin-top: 20px;
      font-size: 11px !important;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .back {
      display: inline-block;
      font-size: 11px;
      color: #8b6c38;
      margin-top: 20px;
    }
    .login-card label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin: 14px 0 6px;
    }
    .login-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      background: white;
      box-sizing: border-box;
    }
    .login-card input:focus {
      outline: 2px solid #c4a15a;
      outline-offset: 2px;
    }
    #loginNotice { overflow-wrap: anywhere; }
    button:disabled { opacity: .7; cursor: wait; }
    @media (max-width: 600px) {
      body { padding: 18px; align-content: center; }
      .professor-profile {
        position: static;
        margin: 12px auto 25px;
        gap: 12px;
      }
      .professor-photo { width: 62px; height: 62px; }
      .professor-details h2 { font-size: 18px; }
      .professor-details p { font-size: 9px; letter-spacing: 1px; }
      .login-card { padding: 26px; margin-top: 0; }
      .login-card h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <a class="professor-profile" href="index.html" aria-label="Return to professor portfolio">
    <img class="professor-photo" src="professor-photo.jpg" alt="Professor portrait">
    <div class="professor-details">
      <h2>Dr. Shaik Imamvali</h2>
      <p>Assistant Professor</p>
    </div>
  </a>

  <main class="login-card">
    <p class="eyebrow eyebrow-dark" style="margin-top:0; margin-bottom:0;">ADMINISTRATION</p>
    <h1>Admin sign in</h1>
    <p>Sign in to manage your academic portfolio, publications, research areas, patents, projects, and achievements.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="Professor's admin email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>

      <button class="button button-gold" type="submit" id="loginButton">Sign in <span>↗</span></button>
    </form>

    <p class="notice" id="loginNotice" role="status" aria-live="polite">Enter the email and password for your Supabase Auth user.</p>
    <a class="back" href="index.html">← Back to portfolio</a>
  </main>

  <script>
    (() => {
      const loginForm = document.getElementById('loginForm');
      const loginNotice = document.getElementById('loginNotice');
      const loginButton = document.getElementById('loginButton');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      function showNotice(message) {
        if (loginNotice) loginNotice.textContent = message;
      }

      function getClient() {
        return window.supabaseClient || null;
      }

      if (!loginForm || !loginNotice || !loginButton || !emailInput || !passwordInput) {
        console.error('Admin login setup error: required HTML elements are missing.');
        showNotice('Login page setup error. Please check admin.html element IDs.');
        return;
      }

      // Verify that Supabase has initialized, then restore an existing session if present.
      async function checkSession() {
        const client = getClient();
        if (!client || !client.auth) {
          showNotice('Supabase is not connected. Check the Supabase script and supabase.js.');
          console.error('window.supabaseClient is not available.');
          return;
        }

        try {
          const { data, error } = await client.auth.getSession();
          if (error) throw error;
          if (data && data.session) {
            window.location.replace('./dashboard.html');
          }
        } catch (error) {
          console.error('Session check failed:', error);
          showNotice('Could not check session: ' + error.message);
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const client = getClient();
        if (!client || !client.auth) {
          showNotice('Supabase is not connected. Check supabase.js.');
          console.error('Supabase client is unavailable.');
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
          showNotice('Enter your email address and password.');
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = 'Signing in…';
        showNotice('Checking your login details…');

        try {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (!data || !data.session) {
            throw new Error('Supabase did not return a login session.');
          }

          showNotice('Login successful. Opening dashboard…');
          window.location.replace('./dashboard.html');
        } catch (error) {
          console.error('Admin sign-in failed:', error);
          showNotice('Sign-in failed: ' + (error && error.message ? error.message : 'Unknown error'));
          passwordInput.value = '';
          loginButton.disabled = false;
          loginButton.innerHTML = 'Sign in <span>↗</span>';
        }
      });

      checkSession();
    })();
  </script>
</body>
</html>
